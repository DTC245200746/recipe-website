# Cấu hình bảo mật dùng chung cho mọi service
x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    <<: *hardening
    image: mysql:8.0
    container_name: recipe-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --local-infile=0
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [backend]
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5
    container_name: recipe-pma
    environment:
      PMA_HOST: db
      HIDE_PHP_VERSION: "true"
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [admin, backend]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256

  app:
    <<: *hardening
    build: ./app
    container_name: recipe-app
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128

  nginx:
    <<: *hardening
    image: nginx:1.27-alpine
    container_name: recipe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    depends_on: [app]
    networks: [edge, frontend, monitoring]
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 128

  # ---------- MONITORING ----------
  cadvisor:
    <<: *hardening
    image: ghcr.io/google/cadvisor:0.55.1
    container_name: recipe-cadvisor
    privileged: true   # cần để đọc cgroup của host (rủi ro chấp nhận, xem README)
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 512

  nginx-exporter:
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: recipe-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    read_only: true
    cap_drop: [ALL]
    depends_on: [nginx]
    networks: [monitoring]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64

  mysqld-exporter:
    <<: *hardening
    image: prom/mysqld-exporter:v0.19.0
    container_name: recipe-mysqld-exporter
    command:
      - --config.my-cnf=/etc/mysqld_exporter/.my.cnf
      - --mysqld.address=db:3306
    volumes:
      - ./monitoring/mysqld-exporter/.my.cnf:/etc/mysqld_exporter/.my.cnf:ro
    read_only: true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, monitoring]
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.5.2
    container_name: recipe-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cap_drop: [ALL]
    networks: [monitoring]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  grafana:
    <<: *hardening
    image: grafana/grafana:12.1.0
    container_name: recipe-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    cap_drop: [ALL]
    depends_on: [prometheus, loki]
    networks: [monitoring]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 256

  # ---------- LOGGING ----------
  loki:
    <<: *hardening
    image: grafana/loki:3.6.0
    container_name: recipe-loki
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    cap_drop: [ALL]
    networks: [monitoring]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  promtail:
    <<: *hardening
    image: grafana/promtail:3.6.0
    container_name: recipe-promtail
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./monitoring/promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    depends_on: [loki]
    networks: [monitoring]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256

networks:
  edge:            # chỉ Nginx: cổng ra/vào từ ngoài
  admin:           # chỉ phpMyAdmin: để publish 127.0.0.1:8081
  frontend:        # nginx <-> app
    internal: true
  backend:         # app, db, phpmyadmin, mysqld-exporter
    internal: true
  monitoring:      # giám sát và log

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
